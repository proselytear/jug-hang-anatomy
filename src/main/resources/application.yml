spring:
  application:
    name: hang-anatomy-demo
  profiles:
    default: local
  threads:
    virtual:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: hang-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 750
      validation-timeout: 500
      leak-detection-threshold: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful
  tomcat:
    threads:
      max: 32
      min-spare: 8
    accept-count: 100
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,dbReadiness
        liveness:
          include: livenessState,ping
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hang.partner.duration: true
        hang.admin.status.duration: true
        hang.health.readiness.duration: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${HANG_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: ${spring.application.name}
    description: Demo for conference talk "Anatomy of a Hang"
    java: 25
    spring-boot: 4.0.6
    stack: spring-mvc-tomcat-postgres-wiremock-grafana

logging:
  level:
    root: INFO
    net.proselyte.demo.hanganatomy: INFO
  file:
    name: ${HANG_LOG_FILE:build/logs/hang-anatomy-demo.json.log}

hang:
  demo:
    default-mode: normal
    simulated-db-delay:
      normal: 0ms
      slow-partner: 0ms
      very-slow-partner: 0ms
      unstable-partner: 0ms
      db-pressure: 400ms
      tx-hold: 1500ms
      recovery: 0ms
  partner:
    base-url: ${HANG_PARTNER_BASE_URL:http://localhost:8089/partner-api/v1}
    dependency-tag: partner-api
    connect-timeout: 250ms
    read-timeout: 1800ms
    overall-deadline: 2s
    timeout:
      enabled: true
      duration: 1500ms
    bulkhead:
      enabled: true
      max-concurrent-calls: 8
      max-wait-duration: 0ms
    circuit-breaker:
      enabled: true
      sliding-window-size: 20
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      slow-call-duration-threshold: 900ms
      slow-call-rate-threshold: 50
      wait-duration-in-open-state: 10s
      permitted-number-of-calls-in-half-open-state: 3
  db:
    bulkhead:
      enabled: false
      max-concurrent-calls: 10
      max-wait-duration: 0ms
  rate-limiter:
    heavy:
      enabled: false
      limit-for-period: 30
      limit-refresh-period: 1s
      timeout-duration: 0ms
  admin:
    cache-ttl: 5s
    db-timeout: 250ms
    simulated-delay: {}
  health:
    readiness-cache-ttl: 5s
    readiness-timeout: 250ms
    db-query: select now()
    simulated-delay: {}
