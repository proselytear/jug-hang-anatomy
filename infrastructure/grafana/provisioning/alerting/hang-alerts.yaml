              to: 0
            model:
              datasource:
                type: prometheus
                uid: mimir
              editorMode: code
              expr: tomcat_threads_busy_threads{application="hang-anatomy-demo"} / clamp_min(tomcat_threads_config_max_threads{application="hang-anatomy-demo"}, 1)
