apiVersion: 1

groups:
  - orgId: 1
    name: Hang Anatomy Alerts
    folder: Hang Anatomy
    interval: 1m
    rules:
      - uid: hang-high-p99
        title: HighEndpointLatencyP99
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: mimir
              editorMode: code
              expr: histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{application="hang-anatomy-demo",uri="/api/v1/dashboard/{id}"}[5m])))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [2]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 1m
        annotations:
          summary: Heavy endpoint p99 is above 2 seconds.
        labels:
          severity: warning
          service: hang-anatomy-demo

      - uid: hang-admin-degraded
        title: AdminEndpointDegraded
        condition: C
