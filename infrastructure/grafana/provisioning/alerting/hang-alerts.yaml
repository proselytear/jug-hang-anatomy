              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: mimir
              editorMode: code
              expr: sum(rate(http_server_requests_seconds_count{application="hang-anatomy-demo",uri="/actuator/health",status!~"2.."}[5m]))
              instant: true
